name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_MEDIA_BASE_URL: https://media.jelementi.quz.ma/
      PLAYWRIGHT_BROWSERS_PREINSTALLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium headless shell and dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm verify:deploy
